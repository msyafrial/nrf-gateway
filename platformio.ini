; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[custom]
device_model = SG-10
device_board_ver = v1.0.0
firmware_version = v1.0.1
ui_version = v1.0.0

[env:esp32doit-devkit-v1]
platform = espressif32@7.1.3
board = esp32doit-devkit-v1
framework = espidf
monitor_speed = 115200
monitor_filters = time
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
extra_scripts = post:scripts/embed_app_desc.py
build_flags =
    -std=gnu++17
    -DCONFIG_DEVICE_MODEL=\"${custom.device_model}\"
    -DCONFIG_DEVICE_BOARD_VER=\"${custom.device_board_ver}\"
    -DCONFIG_FIRMWARE_VERSION=\"${custom.firmware_version}\"
    -DCONFIG_UI_VERSION=\"${custom.ui_version}\"
